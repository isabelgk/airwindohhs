name: Import New Airwindows Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Import only this exact plugin name (optional, for testing one)"
        required: false
      max_plugins:
        description: "Max number of new plugins to import this run (0 = unlimited)"
        default: "5"
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      latest_sha: ${{ steps.latest.outputs.sha }}
      pinned_sha: ${{ steps.latest.outputs.pinned }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync

      - id: latest
        run: |
          sha=$(git ls-remote https://github.com/airwindows/airwindows.git HEAD | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned=$(cut -d@ -f2 airwindows-version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - id: list
        env:
          PLUGIN: ${{ inputs.plugin }}
          MAX_PLUGINS: ${{ inputs.max_plugins }}
        run: |
          if [ -n "$PLUGIN" ]; then
            echo "plugins=$(jq -cn --arg p "$PLUGIN" '[$p]')" >> "$GITHUB_OUTPUT"
          else
            mapfile -t missing < <(uv run grab --list-missing --airwindows-ref "${{ steps.latest.outputs.sha }}")
            max="${MAX_PLUGINS:-5}"
            if [ "$max" != "0" ]; then
              missing=("${missing[@]:0:$max}")
            fi
            printf '%s\n' "${missing[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))' > plugins.json
            echo "plugins=$(cat plugins.json)" >> "$GITHUB_OUTPUT"
          fi

  import:
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    # Plugin titles come from upstream text, so they and everything derived
    # from them reach the shell only through env, never ${{ }} interpolation.
    env:
      PLUGIN: ${{ matrix.plugin }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AIRWINDOWS_BOT_TOKEN || github.token }}

      - id: meta
        run: |
          slug=$(echo "$PLUGIN" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "branch=airwindows-import/$slug" >> "$GITHUB_OUTPUT"

      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          echo "skip=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.existing.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v10.3.0

      - if: steps.existing.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang
          uv sync

      - if: steps.existing.outputs.skip == 'false'
        # The pin is left alone: it may only move together with a refresh of
        # every existing header whose upstream source changed (the sync job).
        run: |
          uv run grab --plugin "$PLUGIN" \
            --airwindows-ref "${{ needs.detect.outputs.latest_sha }}"

      - if: steps.existing.outputs.skip == 'false'
        id: verify
        run: |
          new_file=$(git status --porcelain --untracked-files=all | awk '$1=="??"{print $2}' | grep '^include/' | head -1)
          if [ -z "$new_file" ]; then
            echo "::warning::grab produced no header for $PLUGIN"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "file=$new_file" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.verify.outputs.generated == 'true'
        env:
          FILE: ${{ steps.verify.outputs.file }}
        run: python3 scripts/check_compile.py --cxx clang++ "$FILE"

      - if: steps.verify.outputs.generated == 'true'
        env:
          FILE: ${{ steps.verify.outputs.file }}
        run: scripts/clang-format.sh "$FILE"

      - if: steps.verify.outputs.generated == 'true'
        run: python3 scripts/gen_meta.py

      - if: steps.verify.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ secrets.AIRWINDOWS_BOT_TOKEN || github.token }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          FILE: ${{ steps.verify.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$FILE" include/meta/registry.hpp
          git commit -m "Add $PLUGIN"
          git push -u origin "$BRANCH"
          gh pr create --title "Add $PLUGIN" \
            --body "Auto-generated by the Import New Airwindows Plugins workflow from upstream ${{ needs.detect.outputs.latest_sha }}." \
            --base main --head "$BRANCH"

  sync:
    needs: detect
    if: needs.detect.outputs.latest_sha != needs.detect.outputs.pinned_sha && inputs.plugin == ''
    runs-on: ubuntu-latest
    env:
      BRANCH: airwindows-sync
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AIRWINDOWS_BOT_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v10.3.0

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang
          uv sync

      - run: |
          uv run grab --refresh-changed \
            --airwindows-ref "${{ needs.detect.outputs.latest_sha }}" --update-pin

      # A recategorized plugin shows up as a deleted header plus a new one.
      - id: changed
        run: |
          git add -A include/
          git diff --cached --name-only --diff-filter=d -- include/ > changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - if: steps.changed.outputs.count != '0'
        run: |
          xargs scripts/clang-format.sh < changed.txt
          xargs python3 scripts/check_compile.py --cxx clang++ < changed.txt
          python3 scripts/gen_meta.py

      - env:
          GH_TOKEN: ${{ secrets.AIRWINDOWS_BOT_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add airwindows-version.txt include/
          git commit -m "Sync with upstream ${{ needs.detect.outputs.latest_sha }}"
          git push --force -u origin "$BRANCH"
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh pr create --title "Sync with upstream Airwindows" \
              --body "Regenerates every existing header whose upstream source changed since the pinned commit, and moves airwindows-version.txt to ${{ needs.detect.outputs.latest_sha }}." \
              --base main --head "$BRANCH"
          fi
