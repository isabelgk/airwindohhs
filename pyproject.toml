[project]
name = "airwindohhs"
version = "0.3.1"
description = "Header generator for the airwindohhs C++ plugin collection"
requires-python = ">=3.11"
dependencies = [
    "libclang==18.1.*",
]

[project.scripts]
grab = "scripts.grab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "clang-format==22.1.8",
]
